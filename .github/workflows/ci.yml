name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: aek evaluate
      - run: aek demo
      - run: python -m build
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/aek-wheel
          /tmp/aek-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aek-wheel/bin/aek evaluate
          /tmp/aek-wheel/bin/aek demo
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aek evaluate
      - run: aek demo
  hub:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aek
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: aek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aek -d aek"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AEK_TEST_DATABASE_URL: postgresql+psycopg://aek:synthetic-ci-only@127.0.0.1:5432/aek
      AEK_DATABASE_URL: postgresql+psycopg://aek:synthetic-ci-only@127.0.0.1:5432/aek
      AEK_PUBLIC_ORIGIN: http://127.0.0.1:8787
      AEK_ALLOW_INSECURE_LOCALHOST: '1'
      AEK_STATIC_DIR: dashboard/dist
      AEK_INTEGRATION_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install '.[hub,hub-test]'
      - run: python -m unittest discover -s tests/hub -v
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
      - name: Start hub and exercise live HTTP integration
        run: |
          aek-hub serve > /tmp/aek-hub.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Hub did not become ready')
          PY
          python -m unittest discover -s tests/integration -v
          aek-hub demo
      - name: Browser acceptance on desktop and mobile
        run: |
          cd dashboard
          npx playwright install --with-deps chromium
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          credentials = json.loads(Path('../.aek/demo-credentials.json').read_text())
          env = dict(os.environ, AEK_E2E_REVIEWER_KEY=credentials['reviewer_key'], AEK_E2E_VIEWER_KEY=credentials['viewer_key'])
          raise SystemExit(subprocess.run(['npx', 'playwright', 'test'], env=env).returncode)
          PY
