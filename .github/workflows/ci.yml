name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: aek evaluate
      - run: aek demo
      - run: python -m build
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/aek-wheel
          /tmp/aek-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aek-wheel/bin/aek evaluate
          /tmp/aek-wheel/bin/aek demo
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aek evaluate
      - run: aek demo
