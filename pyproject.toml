[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-experience-kit"
version = "0.2.0"
description = "Turn agent experience into task contracts, evidence gates and regression evaluations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kofi Owusu"}]
keywords = ["agents", "evaluation", "quality-assurance", "checkpoints", "hermes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
hub = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]
hub-test = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/kofiowusuai-lab/agent-experience-kit"
Issues = "https://github.com/kofiowusuai-lab/agent-experience-kit/issues"

[project.scripts]
aek = "agent_experience_kit.cli:main"
aek-hub = "aek_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_experience_kit = ["data/*.json"]
